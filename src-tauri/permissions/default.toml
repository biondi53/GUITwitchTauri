identifier = "allow-save-oauth-token-cmd"
description = "Allows saving OAuth token from frontend"
commands.allow = ["save_oauth_token_cmd"]

[[permission]]
identifier = "allow-get-incognito-default"
description = "Allows reading incognito config"
commands.allow = ["get_incognito_default"]

[[permission]]
