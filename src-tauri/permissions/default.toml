[[permission]]
identifier = "allow-list-streams"
description = "Allows listing streams"
commands.allow = ["list_streams"]

[[permission]]
identifier = "allow-open-login-window"
description = "Allows opening the login window"
commands.allow = ["open_login_window"]

[[permission]]
identifier = "allow-logout-twitch"
description = "Allows logging out"
commands.allow = ["logout_twitch"]

[[permission]]
identifier = "allow-has-twitch-session"
description = "Allows checking Twitch session"
commands.allow = ["has_twitch_session"]

[[permission]]
identifier = "allow-fetch-followed-streams"
description = "Allows fetching followed streams"
commands.allow = ["fetch_followed_streams"]

[[permission]]
identifier = "allow-twitch-oauth-login"
description = "Allows Twitch OAuth login"
commands.allow = ["twitch_oauth_login"]

